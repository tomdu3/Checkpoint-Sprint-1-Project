<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="script.js"></script>
    <title>Bookmark Manager</title>
  </head>

  <body>
    <header>
      <h1>Bookmark Manager</h1>
    </header>

    <main>
      <label for="user_Id">Choose a user:</label>
      <select id="user_Id">
        <option value="">Select a user</option>
      </select>
    </main>

    <!-- Bookmark Form -->
    <section>
      <h2>Add a New Bookmark</h2>
      <form id="bookmark-form">
        <div>
          <label for="url">URL</label>
          <input
            type="url"
            id="url"
            name="url"
            placeholder="http[s]://example.com"
            pattern="https?://(?:[A-Za-z0-9\-]+\.)+[A-Za-z]{2,}(?::\d+)?(?:[\/?#]\S*)?"
            title="Enter a valid URL starting with http:// or https://, e.g. https://example.com"
            required
          />
        </div>
        <div>
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter bookmark title"
            pattern=".*\S.*"
            title="Enter a non-empty title for the bookmark, e.g. Google"
            required
          />
        </div>
        <div>
          <label for="description">Description</label>
          <input
            type="text"
            id="description"
            name="description"
            pattern=".*\S.*"
            placeholder="Brief description"
            title="Enter a non-empty description for the bookmark"
            required
          />
        </div>
        <button type="submit" id="submit-btn">Add Bookmark</button>
      </form>
    </section>
  </body>
</html>
