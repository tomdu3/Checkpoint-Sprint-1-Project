<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="script.js"></script>
    <title>Bookmark Manager</title>
  </head>

  <body>
    <header>
      <h1>Bookmark Manager</h1>
    </header>

    <main>
      <!-- User Menu -->
      <section>
        <h2>User Menu</h2>
        <label for="user_Id" aria-describedby="user-error">Choose a user:</label>
        <select id="user_Id">
          <option value="">Select a user</option>
        </select>
        <p id="user-error" role="alert"></p>
      </section>

      <!-- Bookmark Form -->
      <section>
        <h2>Add a New Bookmark</h2>
        <form id="bookmark-form">
          <div>
            <label for="url">URL</label>
            <input
              type="url"
              id="url"
              name="url"
              placeholder="http[s]://example.com"
              title="Enter a valid URL starting with http:// or https://, e.g. https://example.com"
              required
            />
          </div>
          <div>
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Enter bookmark title"
              pattern=".*\S.*"
              title="Enter a non-empty title for the bookmark, e.g. Google"
              maxlength="80"
              required
            />
          </div>
          <div>
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              placeholder="Brief description"
              title="Enter a non-empty description for the bookmark"
              maxlength="200"
              rows="1"
              required
            >
          </textarea>
          </div>
          <button type="submit" id="submit-btn">Add Bookmark</button>
        </form>
      </section>

      <!-- Bookmark Feed -->
      <section id="bookmark-feed-section">
        <h2>Bookmarks</h2>
        <div id="bookmark-feed">
          <p>Please select a user to view bookmarks.</p>
        </div>
      </section>
    </main>
  </body>
</html>
